# Deploy configuration for the worker in deploy/worker.js.
#
#     npx wrangler deploy        (from the repository root)
#
# This file is the worker's configuration, not the dashboard.  The dashboard
# cannot add the dataset binding at all - it offers the form, takes the
# values, and the binding is simply not there afterwards - so a deploy from
# here is the only way this worker gets one.  Everything it needs is declared
# below, and a fresh deploy cannot come up half-configured.
#
# Every setting is written out even where a default would do, because what is
# not declared is not guaranteed to survive a deploy.

name = "218e-rewired-proxy"
main = "deploy/worker.js"
# The worker uses only fetch, Request, Response, URL and JSON, so nothing here
# turns on this date.  A settled past date avoids a warning from whichever
# wrangler `npx` happens to fetch.
compatibility_date = "2025-01-01"

# The page is served from the zone, not from a workers.dev subdomain - serving
# the same site on two hostnames is a way to have half of it cached under one
# of them.
workers_dev = false

routes = [
  { pattern = "triglavmodular.hu/mods/218e-Rewired*", zone_name = "triglavmodular.hu" }
]

# Where the beacon writes.  This is the only way to add it: the dashboard
# offers Analytics Engine and takes the form, but the binding never saves
# while a build connection owns the worker - bindings have to come from here.
# A deploy that cannot create it fails outright and changes nothing, which is
# the safe direction; the danger was only ever a deploy that succeeded with a
# configuration this file had not described.
[[analytics_engine_datasets]]
binding = "BUILDS"
dataset = "builds"

# Logs were on in the dashboard, and an undeclared setting is not promised to
# survive a deploy, so it is declared.
[observability]
enabled = true
