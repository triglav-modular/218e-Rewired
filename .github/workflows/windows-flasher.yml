name: Windows flasher

# The .bat has never run on Windows.  A runner cannot flash anything — there is
# no instrument — but it can exercise everything up to the point one is needed,
# which is where the mechanical risk lives: certutil's checksum output, the
# delayed-expansion loops, label resolution, and whether the bundled binaries
# run on a clean machine at all.
#
# With no 218e present the script exits at the MIDI check, which is before the
# Zadig launch.  That matters: START /WAIT on a headless runner would hang.

on:
  push:
    paths:
      - 'Program218e_v3_Rewired_Windows.bat'
      - 'windows/support/**'
      # The flasher shells out to both of these, so a change to either
      # can break it without the .bat itself being touched.
      - 'tools/Scan-Images.ps1'
      - 'tools/Find-DfuDevice.ps1'
      - 'tools/validate_hex.py'
      - '.github/workflows/windows-flasher.yml'
  workflow_dispatch:

jobs:
  flasher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No variable is read without being set
        shell: bash
        run: python3 tools/check-bat-vars.py

      - name: The bundled tools run at all
        shell: cmd
        run: |
          echo === dfu-programmer ===
          windows\support\dfu-programmer.exe at32uc3b1256 get bootloader-version
          echo exit=%ERRORLEVEL%  ^(1 with "no device present" is the pass^)
          echo === sendmidi ===
          windows\support\sendmidi.exe list
          echo exit=%ERRORLEVEL%

      - name: certutil checksum parsing matches the real hash
        shell: cmd
        run: |
          echo hello> probe.bin
          for /f "skip=1 tokens=* delims=" %%H in ('certutil -hashfile probe.bin SHA256 ^| findstr /R "^[0-9a-f ]*$"') do (
            if not defined SHA set "SHA=%%H"
          )
          setlocal EnableDelayedExpansion
          set "SHA=!SHA: =!"
          echo parsed: [!SHA!]
          if "!SHA!"=="" ( echo FAILED: parsed nothing & exit /b 1 )
          endlocal

      - name: No image present - must refuse without touching anything
        shell: cmd
        run: |
          (echo YES)> answers0.txt
          CALL Program218e_v3_Rewired_Windows.bat < answers0.txt > out.txt 2>&1
          type out.txt
          findstr /C:"Looked in firmware" out.txt >NUL || (echo FAILED: wrong message & exit /b 1)
          echo PASS: refused with the expected message
          exit /b 0

      - name: The hex validator accepts good images and rejects bad
        shell: cmd
        run: |
          echo :0200000480007A> good.hex
          echo :10200000000102030405060708090A0B0C0D0E0F58>> good.hex
          echo :00000001FF>> good.hex
          python tools\validate_hex.py good.hex || (echo FAILED: rejected a valid image & exit /b 1)
          echo not a hex file> bad.hex
          python tools\validate_hex.py bad.hex && (echo FAILED: accepted junk & exit /b 1)
          del /Q good.hex bad.hex 2>NUL
          echo PASS: validator discriminates
          exit /b 0

      - name: The PowerShell scanner agrees with validate_hex.py
        shell: cmd
        run: |
          mkdir scan_test 2>NUL
          echo :0200000480007A> scan_test\good.hex
          echo :10200000000102030405060708090A0B0C0D0E0F58>> scan_test\good.hex
          echo :00000001FF>> scan_test\good.hex
          echo not a hex file> scan_test\bad.hex
          echo :020000040000FA> scan_test\lowaddr.hex
          echo :0410000000000000EC>> scan_test\lowaddr.hex
          echo :00000001FF>> scan_test\lowaddr.hex
          rem The scanner must list good.hex and nothing else.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Scan-Images.ps1 -DirList "%CD%\scan_test" -Explain > scan_out.txt 2> scan_err.txt
          type scan_out.txt
          type scan_err.txt
          findstr /C:"good.hex" scan_out.txt >NUL || (echo FAILED: scanner rejected a valid image & exit /b 1)
          findstr /C:"bad.hex" scan_out.txt >NUL && (echo FAILED: scanner accepted junk & exit /b 1)
          findstr /C:"lowaddr.hex" scan_out.txt >NUL && (echo FAILED: scanner accepted a bootloader-region image & exit /b 1)
          rem And python must reach the same three verdicts.
          python tools\validate_hex.py scan_test\good.hex || (echo FAILED: python rejected a valid image & exit /b 1)
          python tools\validate_hex.py scan_test\bad.hex && (echo FAILED: python accepted junk & exit /b 1)
          python tools\validate_hex.py scan_test\lowaddr.hex && (echo FAILED: python accepted a bootloader image & exit /b 1)
          rmdir /S /Q scan_test 2>NUL
          del /Q scan_out.txt scan_err.txt 2>NUL
          echo PASS: both validators agree
          exit /b 0

      - name: More than one image - must list them and ask
        shell: cmd
        run: |
          del /Q *.hex 2>NUL
          del /Q firmware\*.hex "%USERPROFILE%\Downloads\*.hex" "%USERPROFILE%\Desktop\*.hex" 2>NUL
          mkdir "%USERPROFILE%\Downloads" 2>NUL
          echo :0200000480007A> "%USERPROFILE%\Downloads\custom.hex"
          echo :10200000000102030405060708090A0B0C0D0E0F58>> "%USERPROFILE%\Downloads\custom.hex"
          echo :00000001FF>> "%USERPROFILE%\Downloads\custom.hex"
          mkdir firmware 2>NUL
          copy /Y "%USERPROFILE%\Downloads\custom.hex" firmware\second.hex >NUL
          rem Consent, then pick nothing: it must have listed both and stopped.
          (echo YES& echo.& echo.)> ans2.txt
          CALL Program218e_v3_Rewired_Windows.bat < ans2.txt > out4.txt 2>&1
          type out4.txt
          findstr /C:"flashable images found" out4.txt >NUL || (echo FAILED: did not list the images & exit /b 1)
          findstr /C:"Newest first" out4.txt >NUL || (echo FAILED: no ordering shown & exit /b 1)
          findstr /C:"Nothing chosen" out4.txt >NUL || (echo FAILED: did not stop on an empty choice & exit /b 1)
          findstr /C:"Erasing the application flash" out4.txt >NUL && (echo FAILED: erased without a choice & exit /b 1)
          del firmware\second.hex "%USERPROFILE%\Downloads\custom.hex" 2>NUL
          echo PASS: listed, ordered, stopped without a choice
          exit /b 0

      - name: A lone custom image flashes without extra ceremony
        shell: cmd
        run: |
          rem The only valid image present is NOT the one shipped with the
          rem package.  It should be selected and used, not gated behind a
          rem second confirmation - the flasher installs any valid image.
          rem Clear anything an earlier step left where the flasher searches,
          rem so "exactly one image" is true rather than assumed.
          del /Q *.hex 2>NUL
          del /Q firmware\*.hex 2>NUL
          del /Q "%USERPROFILE%\Downloads\*.hex" "%USERPROFILE%\Desktop\*.hex" 2>NUL
          mkdir "%USERPROFILE%\Downloads" 2>NUL
          echo :0200000480007A> "%USERPROFILE%\Downloads\custom.hex"
          echo :10200000000102030405060708090A0B0C0D0E0F58>> "%USERPROFILE%\Downloads\custom.hex"
          echo :00000001FF>> "%USERPROFILE%\Downloads\custom.hex"
          (echo YES& echo.)> ans.txt
          CALL Program218e_v3_Rewired_Windows.bat < ans.txt > out3.txt 2>&1
          type out3.txt
          findstr /C:"Type FLASH" out3.txt >NUL && (echo FAILED: still gating on the checksum & exit /b 1)
          findstr /C:"is not the image this flasher" out3.txt >NUL && (echo FAILED: pairing language remains & exit /b 1)
          findstr /C:"image " out3.txt >NUL || (echo FAILED: did not report the image fingerprint & exit /b 1)
          del "%USERPROFILE%\Downloads\custom.hex" 2>NUL
          echo PASS: a custom image is used without a checksum gate
          exit /b 0

      - name: The USB probe runs and reports no Atmel DFU device
        shell: cmd
        run: |
          rem No instrument on a runner, so it must say ABSENT rather than fail.
          for /f "delims=" %%S in ('powershell -NoProfile -ExecutionPolicy Bypass -File tools\Find-DfuDevice.ps1 2^>NUL') do set "STATE=%%S"
          echo probe said: [%STATE%]
          if not "%STATE%"=="ABSENT" (echo FAILED: expected ABSENT with no device & exit /b 1)
          echo PASS: USB probe reports absence cleanly
          exit /b 0

      - name: With a matching image - must verify and reach the MIDI step
        shell: cmd
        run: |
          rem Stand-in image: patch a copy of the flasher to expect its hash,
          rem so the checksum path runs for real without shipping firmware.
          rem It has to be a genuine app-region image now - the flasher
          rem validates structure before it ever looks at a checksum.
          del /Q *.hex 2>NUL
          del /Q "%USERPROFILE%\Downloads\*.hex" "%USERPROFILE%\Desktop\*.hex" 2>NUL
          mkdir firmware 2>NUL
          del /Q firmware\*.hex 2>NUL
          echo :0200000480007A> firmware\218eV3_v369_Rewired_DFU.hex
          echo :10200000000102030405060708090A0B0C0D0E0F58>> firmware\218eV3_v369_Rewired_DFU.hex
          echo :00000001FF>> firmware\218eV3_v369_Rewired_DFU.hex
          for /f "skip=1 tokens=* delims=" %%H in ('certutil -hashfile firmware\218eV3_v369_Rewired_DFU.hex SHA256 ^| findstr /R "^[0-9a-f ]*$"') do (
            if not defined SHA set "SHA=%%H"
          )
          setlocal EnableDelayedExpansion
          set "SHA=!SHA: =!"
          powershell -Command "(Get-Content 'Program218e_v3_Rewired_Windows.bat' -Raw) -replace '(?<=EXPECTED_SHA256=)[0-9a-f]{64}', '!SHA!' | Set-Content 'ci.bat'"
          endlocal
          rem Answers come from a file, not a pipe: a piped line is consumed by
          rem the first subshell the script spawns, so SET /P then reads EOF and
          rem the consent gate rejects an empty answer.  Repeated so each prompt
          rem up to the MIDI check has one.
          (echo YES& echo.& echo.)> answers.txt
          rem CALL, not a bare invocation: running one .bat from another without
          rem CALL transfers control and never returns, so every assertion below
          rem would be skipped and the step would report the flasher's own exit
          rem code instead.
          CALL ci.bat < answers.txt > out2.txt 2>&1
          type out2.txt
          findstr /C:"Rewired 1.0.0" out2.txt >NUL || (echo FAILED: version not shown & exit /b 1)
          findstr /C:"No MIDI output port" out2.txt >NUL || (echo FAILED: did not stop at MIDI & exit /b 1)
          rem The runner has no MIDI at all, so the list must be shown and empty.
          findstr /C:"MIDI output ports Windows is offering" out2.txt >NUL || (echo FAILED: did not show the port list & exit /b 1)
          rem Not the bare word "erase" - the warning text contains "was erased".
          findstr /C:"Erasing the application flash" out2.txt >NUL && (echo FAILED: reached the erase & exit /b 1)
          rem "Starting Zadig", not the bare word: the MIDI diagnostics mention
          rem Zadig by name when explaining how to undo a wrong driver binding.
          findstr /C:"Starting Zadig" out2.txt >NUL && (echo FAILED: reached the Zadig launch & exit /b 1)
          echo PASS: verified, versioned, stopped before touching anything
          rem ECHO does not reset ERRORLEVEL in cmd, so without this the step
          rem inherits the 1 from the last findstr that correctly found nothing.
          exit /b 0
