# Watches buchla.com for a new stock firmware and opens an issue when one
# appears, which is how the notice reaches a mailbox: GitHub already mails what
# it opens, so this needs no mail credential, no SMTP and no third-party
# account of its own.
#
# GitHub only ever runs a scheduled workflow from the default branch, so this
# watches nothing at all until it is on main.
#
# It also disables a schedule on a public repository after 60 days with no
# repository activity, warning the owner by mail first. The baseline commit
# below is activity whenever buchla.com moves, but a quiet year is genuinely
# quiet - so the warning mail is the thing to not ignore.
name: Watch buchla.com

on:
  schedule:
    # 06:17 UTC rather than the top of an hour: everyone else's cron is at
    # midnight, and a schedule that queues behind them drifts.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # the baseline is committed back
  issues: write     # the notice is an issue

# Two of these at once would both read the same baseline and both report the
# same release.
concurrency:
  group: buchla-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # For DecompressionStream and crypto.subtle, which is how the
          # changelog is inflated out of a range read rather than a download.
          node-version: '22'

      - name: Check buchla.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/watch-buchla-run.mjs

      - name: Keep the baseline
        run: |
          # The failure count lives in this file too, so it has to survive
          # between runs - without the commit, every run would start from zero
          # and the seven-day alarm would never reach seven.
          if git diff --quiet -- firmware/buchla-watch.json; then
            echo "baseline unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/buchla-watch.json
          git commit -m "Buchla watch: baseline moved"
          git push
