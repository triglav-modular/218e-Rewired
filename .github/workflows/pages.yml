name: Builder page

# The builder runs entirely in the browser: it needs the user's own factory
# image, which is not in this repository and never leaves their machine.  So it
# can be served as a static page with nothing behind it.
#
# generated.js is regenerated here rather than trusting the committed copy, so
# the deployed page can never describe a build the source no longer produces.
# Everything it reads is tracked; the factory checksum comes from the config,
# not from the image itself.

on:
  push:
    branches: [main]
    # Everything the job reads, not just the page.  generate.py embeds the
    # four flasher scripts and the job copies the validators and the tool
    # binaries into the kit, so a safety fix to any of them has to redeploy.
    # Left out, they were only ever published when some file under web/
    # happened to change in the same commit.
    paths:
      - 'web/**'
      - 'src/AssemblePressureFix.java'
      - 'config/218e.toml'
      - 'tunings/**'
      - 'tools/avr32/**'
      - 'tools/factory_control_flow.txt'
      - 'tools/validate_hex.py'
      - 'tools/Scan-Images.ps1'
      - 'tools/Find-DfuDevice.ps1'
      - 'tools/Show-Menu.ps1'
      - 'tools/version-assets.py'
      - 'tools/sync-site.py'
      - 'Program218e_v3_Rewired_macOS.command'
      - 'Program218e_v3_Rewired_Windows.bat'
      - 'mac/Flasher.zip'
      - 'mac/support/**'
      - 'windows/support/**'
      - 'windows/launcher/**'
      - 'THIRD-PARTY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # The menu and the palette are mirrored from triglavmodular.hu at build time,
  # and that site changing is not an event this repository can see.  A weekly
  # rebuild is what carries such a change onto the page without anyone pushing
  # here.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the page's embedded data
        run: python3 web/generate.py

      - name: The regenerated bundle must match what is committed
        # A mismatch means someone edited the source without re-running
        # generate.py.  The deploy is still correct - it uses what was just
        # generated - but the repository is stale and should be fixed.
        run: |
          if ! git diff --quiet -- web/generated.js web/assembler.js; then
            echo "::warning::web/generated.js or web/assembler.js is stale in git; run python3 web/generate.py and commit"
            git diff --stat -- web/generated.js web/assembler.js
          else
            echo "committed bundle is up to date"
          fi

      # web/test_configs.py is NOT run here: it compares the browser build
      # against tools/build.py, and build.py needs the factory image, which is
      # Buchla's and not in this repository.  That equivalence is checked
      # locally where the image exists.  What can be checked here is that the
      # page's own data regenerates from tracked sources, which is the step
      # above.

      - name: Stage the site
        run: |
          mkdir -p _site
          # Copy everything in web/ except the build and test tooling, rather
          # than naming each file: a hardcoded list silently drops any asset
          # added later, which is exactly how images/ and fonts/ came to 404
          # on a page that referenced them.
          rsync -a --exclude '*.py' --exclude '_*' web/ _site/
          # The header menu and the palette-and-sweep belong to the theme on
          # triglavmodular.hu, so both are resolved here rather than trusted
          # from the copies in the repository.  Before the stamping below, as
          # it rewrites style.css and the stamp is a hash of it.  It cannot
          # fail the build: unreachable or unrecognisable, it leaves what is
          # committed alone and says why.
          python3 tools/sync-site.py _site
          # The flashing tools travel with a download, so the page has to be
          # able to fetch them.  No VC_redist and no msvcp140.dll: our
          # dfu-programmer links its runtime statically, so there is nothing
          # to install.  Nor the pressure readout, which is not flashing.
          # macOS takes the signed app instead, which already has the tools
          # sealed inside it.  It cannot be built here: signing needs the
          # Developer ID and notarising needs the notary credentials, and
          # neither belongs in Actions - so it is committed, built by
          # tools/make-app.sh on a machine that has them.
          mkdir -p _site/kit/mac _site/kit/windows/support _site/kit/tools
          cp mac/Flasher.zip _site/kit/mac/Flasher.zip
          for f in dfu-programmer.exe sendmidi.exe zadig-2.8.exe; do
            cp "windows/support/$f" _site/kit/windows/support/
          done
          cp tools/Scan-Images.ps1 tools/Find-DfuDevice.ps1 tools/Show-Menu.ps1 \
             tools/validate_hex.py _site/kit/tools/
          du -sh _site/kit/mac _site/kit/windows
          # Every asset URL carries a hash of the file it points at, so an
          # update cannot be served from a cache that still holds the old one.
          # Without this a changed style.css keeps its name, and a browser
          # told it may hold that name for ten minutes does exactly that.
          python3 tools/version-assets.py _site
          # No Jekyll: filenames here are ordinary, but underscore-prefixed
          # paths would be dropped silently and that is a nasty way to find out.
          touch _site/.nojekyll
          find _site -type f | sort

      - name: The committed page should be in step with the main site
        # What deploys is already current - the step above saw to that.  This
        # only says whether the copies in the repository have fallen behind,
        # which matters because those are what a local clone opens with no
        # network, and what anybody reads to see what the page is.
        run: |
          if ! python3 tools/sync-site.py --check web; then
            echo "::warning::web/ is behind triglavmodular.hu; run tools/sync-site.py and commit"
          fi

      - name: The committed app must match the sources it was built from
        run: |
          python3 - <<'CHECK'
          import sys, zipfile
          from pathlib import Path
          # The app is built by hand on a machine with the Developer ID, so
          # nothing here stops it going stale.  This does: if the flasher inside
          # the bundle is not the flasher in the repository, the app people
          # download would be a version behind and no one would notice.
          z = zipfile.ZipFile("mac/Flasher.zip")
          names = z.namelist()
          root = "218e Rewired Flasher.app/Contents/"
          missing = [n for n in (root + "Info.plist", root + "CodeResources",
                                 root + "_CodeSignature/CodeResources")
                     if n not in names]
          if missing:
              sys.exit("mac/Flasher.zip is not a signed, stapled app: "
                       + ", ".join(missing))
          # CodeResources at the top of Contents is the stapled notarisation
          # ticket, and it starts with its own magic.
          if z.read(root + "CodeResources")[:4] != b"s8ch":
              sys.exit("mac/Flasher.zip carries no notarisation ticket - "
                       "it was archived before stapling")
          for inside, repo in ((root + "Resources/Program218e_v3_Rewired_macOS.command",
                                "Program218e_v3_Rewired_macOS.command"),):
              if z.read(inside) != Path(repo).read_bytes():
                  sys.exit(f"{repo} has changed since the app was built - "
                           f"rebuild with tools/make-app.sh --notarize and "
                           f"commit mac/Flasher.zip")
          print(f"the committed app is current ({len(names)} entries)")
          CHECK

      - name: Every asset the page asks for must be present
        run: |
          python3 - <<'CHECK'
          import re, sys
          from pathlib import Path
          site = Path("_site")
          # The stylesheet is scanned as well as the page: the fonts and the
          # background are reached through url() from style.css, so a check
          # that only read index.html would have stopped seeing them the
          # moment the CSS moved out of it.
          # app.js too: the flashing tools are fetched by script, so their URLs
          # are string literals that neither the markup nor the CSS scan
          # would ever see.  That is how kit/mac/Flasher.zip went on being
          # served from cache after the app inside it changed.
          sources = ["index.html", "style.css", "app.js"]
          missing = []
          total = 0
          for name in sources:
              f = site / name
              if not f.exists():
                  print(f"::error::{name} is not in _site at all")
                  missing.append(name)
                  continue
              text = f.read_text()
              refs = set()
              for m in re.finditer(r'(?:src|href)="([^"]+)"', text):
                  refs.add(m.group(1))
              for m in re.finditer(r'url\(["\']?([^"\')]+)', text):
                  refs.add(m.group(1))
              for m in re.finditer(r'["\'](kit/[^"\']+)["\']', text):
                  refs.add(m.group(1))
              total += len(refs)
              for r in sorted(refs):
                  if r.startswith(("http://", "https://", "//", "#", "data:", "mailto:")):
                      continue
                  # Assets carry a ?v= hash by this point; the file on disk
                  # does not, and never will.
                  path = r.split("?", 1)[0]
                  if not (site / path).exists():
                      print(f"::error::{name} references {r}, which is not in _site")
                      missing.append(r)
                  elif "?v=" not in r:
                      # A reference that missed the stamp would be served from
                      # a cache after the next change, silently.
                      print(f"::error::{name} references {r} without a version stamp")
                      missing.append(r)
          print(f"checked {total} references across {len(sources)} files, {len(missing)} missing")
          sys.exit(1 if missing else 0)
          CHECK

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
