name: Builder page

# The builder runs entirely in the browser: it needs the user's own factory
# image, which is not in this repository and never leaves their machine.  So it
# can be served as a static page with nothing behind it.
#
# generated.js is regenerated here rather than trusting the committed copy, so
# the deployed page can never describe a build the source no longer produces.
# Everything it reads is tracked; the factory checksum comes from the config,
# not from the image itself.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/AssemblePressureFix.java'
      - 'config/218e.toml'
      - 'tunings/**'
      - 'tools/avr32/**'
      - 'tools/factory_control_flow.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the page's embedded data
        run: python3 web/generate.py

      - name: The regenerated bundle must match what is committed
        # A mismatch means someone edited the source without re-running
        # generate.py.  The deploy is still correct - it uses what was just
        # generated - but the repository is stale and should be fixed.
        run: |
          if ! git diff --quiet -- web/generated.js web/assembler.js; then
            echo "::warning::web/generated.js or web/assembler.js is stale in git; run python3 web/generate.py and commit"
            git diff --stat -- web/generated.js web/assembler.js
          else
            echo "committed bundle is up to date"
          fi

      # web/test_configs.py is NOT run here: it compares the browser build
      # against tools/build.py, and build.py needs the factory image, which is
      # Buchla's and not in this repository.  That equivalence is checked
      # locally where the image exists.  What can be checked here is that the
      # page's own data regenerates from tracked sources, which is the step
      # above.

      - name: Stage the site
        run: |
          mkdir -p _site
          # Copy everything in web/ except the build and test tooling, rather
          # than naming each file: a hardcoded list silently drops any asset
          # added later, which is exactly how images/ and fonts/ came to 404
          # on a page that referenced them.
          rsync -a --exclude '*.py' --exclude '_*' web/ _site/
          # The flashing tools travel with a download, so the page has to be
          # able to fetch them.  No VC_redist and no msvcp140.dll: our
          # dfu-programmer links its runtime statically, so there is nothing
          # to install.  Nor the pressure readout, which is not flashing.
          mkdir -p _site/kit/mac/support/buchla-dfu/dfu \
                   _site/kit/mac/support/buchla-dfu/Frameworks \
                   _site/kit/windows/support _site/kit/tools
          cp mac/support/sendmidi                                _site/kit/mac/support/
          cp mac/support/buchla-dfu/dfu/dfu-programmer           _site/kit/mac/support/buchla-dfu/dfu/
          cp mac/support/buchla-dfu/Frameworks/libusb-1.0.0.dylib _site/kit/mac/support/buchla-dfu/Frameworks/
          for f in dfu-programmer.exe sendmidi.exe zadig-2.8.exe; do
            cp "windows/support/$f" _site/kit/windows/support/
          done
          cp tools/Scan-Images.ps1 tools/Find-DfuDevice.ps1 tools/validate_hex.py _site/kit/tools/
          du -sh _site/kit/mac _site/kit/windows
          # No Jekyll: filenames here are ordinary, but underscore-prefixed
          # paths would be dropped silently and that is a nasty way to find out.
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Every asset the page asks for must be present
        run: |
          python3 - <<'CHECK'
          import re, sys
          from pathlib import Path
          site = Path("_site")
          html = (site / "index.html").read_text()
          refs = set()
          for m in re.finditer(r'(?:src|href)="([^"]+)"', html):
              refs.add(m.group(1))
          for m in re.finditer(r'url\(["\']?([^"\')]+)', html):
              refs.add(m.group(1))
          missing = []
          for r in sorted(refs):
              if r.startswith(("http://", "https://", "//", "#", "data:", "mailto:")):
                  continue
              if not (site / r).exists():
                  missing.append(r)
          for r in missing:
              print(f"::error::index.html references {r}, which is not in _site")
          print(f"checked {len(refs)} references, {len(missing)} missing")
          sys.exit(1 if missing else 0)
          CHECK

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
