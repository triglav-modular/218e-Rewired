name: Firmware and flashers

# The core checks had no workflow at all: tools/test.py, the browser build
# matrix and the macOS flasher were only ever run by hand, which is how a
# stale assertion and a drifted harness both survived in the repository.
#
# Ghidra is not available here, so this runs the JavaScript toolchain.  That
# is not a gap in coverage: sweep.py proves the two produce identical images,
# and it needs a machine with Ghidra on it.
#
# Anything that builds firmware needs Buchla's stock image, which is theirs
# and is not in this repository - firmware/*.hex is gitignored.  Those steps
# are skipped with a notice unless the image is supplied.
#
# Not as a secret directly: the image is 255 KB and a GitHub secret caps at
# 48 KB, so it does not fit even gzipped and base64-encoded.  FACTORY_HEX_URL
# points at somewhere it can be fetched from - a private release asset or
# private repository - and FACTORY_HEX_TOKEN authorises the fetch.  The secret
# then holds a credential, which is what a secret is for, rather than a file
# it cannot hold anyway.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Supply the factory image, if this repository has one
        id: factory
        env:
          FACTORY_HEX_URL: ${{ secrets.FACTORY_HEX_URL }}
          FACTORY_HEX_TOKEN: ${{ secrets.FACTORY_HEX_TOKEN }}
        run: |
          if [ -z "$FACTORY_HEX_URL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No FACTORY_HEX_URL secret - the build steps are skipped. Buchla's image is not redistributable, so it cannot live in the repository."
            exit 0
          fi
          mkdir -p firmware
          if [ -n "$FACTORY_HEX_TOKEN" ]; then
            set -- -H "Authorization: Bearer $FACTORY_HEX_TOKEN"
          else
            set --
          fi
          # --fail so an HTML error page cannot be mistaken for an image, and
          # no -v anywhere near this: the token is in the request headers.
          curl -sS --fail --location "$@" "$FACTORY_HEX_URL" \
               -o firmware/218eV3_v369_DFU.hex \
            || { echo "::error::could not fetch the factory image"; exit 1; }
          # It is the wrong file if it is not the file the build is pinned to,
          # and every later step would be checking the wrong thing.
          want="$(python3 -c "import tomllib;print(tomllib.load(open('config/218e.toml','rb'))['firmware']['factory_sha256'])")"
          got="$(shasum -a 256 firmware/218eV3_v369_DFU.hex | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "::error::factory image checksum is $got, expected $want"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Factory image fetched and verified."

      - name: Unit tests
        run: python3 tools/test.py

      - name: Unit tests, and the golden image
        if: steps.factory.outputs.present == 'true'
        run: python3 tools/test.py --golden

      - name: The build is reproducible
        if: steps.factory.outputs.present == 'true'
        run: |
          python3 tools/build.py --no-ghidra
          python3 tools/build.py --no-ghidra --expect-sha \
            "$(python3 -c "import tomllib;print(tomllib.load(open('config/218e.toml','rb'))['firmware']['golden_sha256'])")"

      - name: Every option combination builds and is distinct
        if: steps.factory.outputs.present == 'true'
        run: |
          cd web
          /System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc \
            generated.js sha256.js buildlib.js assembler.js zip.js build.js \
            test_matrix.js -- ../firmware/218eV3_v369_DFU.hex \
            ../calibration/218e-pitch-calibration.csv

      - name: The browser build agrees with build.py
        if: steps.factory.outputs.present == 'true'
        run: python3 web/test_configs.py

      - name: generated.js is not stale
        run: |
          python3 web/generate.py
          git diff --exit-code -- web/generated.js web/assembler.js \
            || { echo "::error::generated.js is out of date - run python3 web/generate.py"; exit 1; }

  flasher-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: The scripts parse
        run: |
          bash -n Program218e_v3_Rewired_macOS.command

      - name: The bundled tools run, and are universal
        run: |
          mac/support/dfu/bin/dfu-programmer at32uc3b1256 get bootloader-version \
            2>&1 | tee out.txt || true
          grep -q "no device present" out.txt \
            || { echo "::error::dfu-programmer did not report an absent device"; exit 1; }
          lipo -archs mac/support/dfu/bin/dfu-programmer | grep -q "x86_64 arm64" \
            || { echo "::error::dfu-programmer is not universal"; exit 1; }

      - name: The flasher runs, and answers to arrow keys
        run: python3 tools/test_menu.py

      - name: A download built by the page still holds a trusted app
        run: python3 tools/test_zip.py

      - name: A partial image is refused
        run: |
          python3 - <<'PY'
          def rec(kind, addr, data):
              b = [len(data), (addr >> 8) & 0xFF, addr & 0xFF, kind] + list(data)
              return ':' + ''.join('%02X' % x for x in b + [(-sum(b)) & 0xFF])
          open('tiny.hex','w').write('\n'.join(
              [rec(4,0,[0x80,0x00]), rec(0,0x2000,[0]*16), rec(1,0,[])]) + '\n')
          # The same sixteen bytes, written 1,024 times.  A validator that adds
          # up declared record lengths calls this a 16 KB image; it covers
          # sixteen bytes, and flashing it leaves the instrument unbootable.
          open('overlap.hex','w').write('\n'.join(
              [rec(4,0,[0x80,0x00])] + [rec(0,0x2000,[0]*16)] * 1024
              + [rec(1,0,[])]) + '\n')
          # Sixteen bytes, then the end marker, then a whole image nobody
          # reads: dfu-programmer's loop is `while (1 != record.type)`.
          full = [rec(0, 0x2010 + 16*i, [0xFF]*16) for i in range(1023)]
          open('after_eof.hex','w').write('\n'.join(
              [rec(4,0,[0x80,0x00]), rec(0,0x2000,[0]*16), rec(1,0,[])]
              + full) + '\n')
          # Type 5 is nominally the entry point, but dfu-programmer sets its
          # address offset from it, so everything after this lands 0x2000 high.
          body = [rec(0, 0x2000 + 16*i, [0]*16) for i in range(1024)]
          open('type5.hex','w').write('\n'.join(
              [rec(4,0,[0x80,0x00]), rec(5,0,[0x80,0x00,0x20,0x00])]
              + body + [rec(1,0,[])]) + '\n')
          PY
          if python3 tools/validate_hex.py tiny.hex; then
            echo "::error::a 16-byte image was accepted - it would erase the application and not replace it"
            exit 1
          fi
          if python3 tools/validate_hex.py overlap.hex; then
            echo "::error::an image that covers 16 bytes 1,024 times was accepted as 16 KB"
            exit 1
          fi
          if python3 tools/validate_hex.py after_eof.hex; then
            echo "::error::16 bytes before the EOF record and 16 KB after it was accepted - dfu-programmer stops at EOF and would write the 16"
            exit 1
          fi
          if python3 tools/validate_hex.py type5.hex; then
            echo "::error::a type-5 record before the data was accepted - dfu-programmer uses it as an address offset, so the data lands away from the reset vector"
            exit 1
          fi
          # A real image is not available here, so prove the other direction
          # with a generated one that is the right shape.
          pwsh -File tools/Make-TestImage.ps1 -Path full.hex -Bytes 20480
          python3 tools/validate_hex.py full.hex

      - name: An image given as an argument is the one used
        run: |
          # Regression test for the argument path: accept_choice used to be
          # called above its own definition, so the named file was validated
          # and then quietly replaced by whatever the scan found.
          awk '/^accept_choice\(\) \{/{f=NR} /^if \[ -n "\$\{1:-\}" \]/{c=NR}
               END{ if (c < f) { print "call at " c " precedes definition at " f; exit 1 }
                    print "argument block at " c " sits below accept_choice at " f }' \
              Program218e_v3_Rewired_macOS.command
