# ===========================================================================
# Buchla 218e V3 — custom firmware
# ===========================================================================
# Seven options.  Everything else is fixed at the value the firmware was built
# and tested with; see tools/options.py for those constants and docs/BUILD.md
# for what they are.
#
#   python3 tools/build.py
# ===========================================================================

[options]

# 1. LATCHING ARPEGGIATOR
# The three-position arp switch becomes latch / regular / off.  In latch, keys
# are toggles and leaving the position releases everything.  Latched notes are
# pitches, not keys, so one key held in three octaves stacks three notes.
# false restores the factory ascending / random / off switch.
latching_arp = true

# 2. REMAP KNOBS 1-4
# Outside edit mode the four preset-voltage knobs become arpeggiator note
# order, arpeggiator rhythm, random octave displacement, and global vibrato.
# false hands all four back to the factory preset voltages.
# Edit-mode knob 1 (pressure calibration) and knob 4 (curve) are unaffected.
remap_knobs = true

# 3. PER-KEY PITCH CORRECTION
# Corrects the 208's measured tracking error per semitone.  Point this at a
# CSV of your own measurements:
#
#   pitch_correction = "calibration/218e-pitch-calibration.csv"
#
# Measure with a tuner against 12-TET, then fold the readings in:
#   python3 tools/build.py --fold-measurement <your-readings.csv>
#
# false emits an ideal ramp with no per-key trim, and is the default.  The
# table in calibration/ is an example, not a starting point: it was measured on
# one specific instrument with its 208 trimmed to 1 V/oct, which is neither
# your oscillator nor, by default, your scaling.  Measure your own, at the
# volts_per_octave you actually use.
pitch_correction = false

# 4. ALTERNATE TUNINGS
# Up to three Scala files, switchable from edit mode (key 28 toggles slot 0,
# key 27 toggles slot 1; LEDs rem-en / trn).  Each must be a 12-note scale
# with a true 2/1 octave, because the key table repeats every octave.
#
#   alternate_tunings = ["tunings/Sabat II (C-rooted).scl",
#                        "tunings/5-Limit JI with Septimal 7th.scl",
#                        "tunings/12TET.scl"]
#
# A slot may instead be a scale paired with a Scala keyboard mapping, which
# lifts the twelve-degree rule: the .kbm says which degree each key takes, so
# a scale of any size can be laid out however you like.
#
#   alternate_tunings = [["tunings/24TET.scl", "tunings/24TET-neutral.kbm"],
#                        "tunings/12TET.scl"]
#
# Keys the mapping leaves out sound their nearest mapped neighbour - the
# firmware has no way to make a key silent.  The mapping's own reference note
# and frequency are read and ignored: this instrument has no MIDI note
# numbers, and its absolute pitch comes from the 208's trimmer, so which key
# stays put across slots remains [tuning].reference_key.
#
# A scale need not repeat at the octave.  The key table steps whatever period
# the file declares, and the octave controls - the panel switch, the
# arpeggiator's random octave, knob 3's span - are rebuilt to step that same
# period, so a Bohlen-Pierce tritave moves the keyboard by a tritave.  There
# is one set of those controls, so every slot must repeat at the same
# interval; the factory temperament repeats at the octave.
#
# Slots you do not fill keep the instrument's own temperament.  false gives
# all three slots the factory temperament, i.e. no retuning at all.
alternate_tunings = false

# 5. VOLTS PER OCTAVE
# 1.2 is the standard Buchla scaling and the default, since that is what this
# keyboard normally drives.
#
# 1.0 rescales the pitch ramp for 1 V/oct gear.
#
# Changing this moves every pitch and the 208 will need retrimming.  A
# pitch_correction table stays valid across the change, because it is stored
# in cents rather than volts.
volts_per_octave = 1.2


# 6. PRESSURE RESPONSE FIX
# The reworked pressure path: a more gentle pressure curve allowing for more
# expressive play, pressure combined across all held keys instead of following
# the last one, per-key proximity rejection, and interpolated DAC output.
# false returns the whole pressure path to the factory behaviour.
pressure_fix = true

# 7. PRESSURE-BASED PORTAMENTO
# Notes snap, and pitch moves between held notes as
# their relative pressure moves.  The portamento knob sets how much pressure a
# second note needs to bend, and is fully off at zero.
# false restores the factory time-based glide.
pressure_portamento = true


# ---------------------------------------------------------------------------
# Paths and checksums (not behaviour)
# ---------------------------------------------------------------------------
[firmware]
factory_hex    = "firmware/218eV3_v369_DFU.hex"
factory_sha256 = "565f2d0c3466edfd13ddc1626cb7a74204723ff3a01f65eac34a9db99901dd47"
output_hex     = "build/218eV3_v369_Rewired_DFU.hex"

# The updaters refuse to flash an image whose checksum they do not know.  The
# build rewrites their EXPECTED_SHA256 and the instructions they print, so a
# flasher can never describe or install a build it was not generated for.
updaters       = ["Program218e_v3_Rewired_macOS.command",
                  "218e_Rewired_Flasher.bat"]

# Human-readable version of this firmware.  The image's real identity is its
# SHA-256, which is derived and cannot drift; this is the part people can say
# out loud.  The build reports them together as "Rewired <version> (<sha8>)"
# and writes that into both flashers.
version        = "2.0.0"

# The image this configuration is expected to produce.  tools/test.py --golden
# rebuilds and compares against it, so any unintended change in the assembly,
# the generated tables or the patch set shows up as a test failure.
golden_sha256  = "1303ba8931423192f643ef1300e0d262add4bb0506b1fa05f6cee5c2f9c0f3c3"


[tools]
# Ghidra assembles every patch.  This path is machine-specific, so set it
# with the GHIDRA_HOME environment variable or in config/local.toml, which is
# untracked:
#
#     [tools]
#     ghidra_home = "/path/to/ghidra_12.1.2_PUBLIC"
ghidra_home = ""
